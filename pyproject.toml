[project]
name = "sqrlly"
version = "0.9.1"
description = "Workflow orchestrator using LangGraph with Claude (via ACP) and script execution backends"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Seaman", email = "chris@badmath.org" },
]
keywords = ["workflow", "orchestration", "langgraph", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "langgraph>=1.0",
    "jinja2>=3.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "simpleeval>=0.9.13",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/christopherseaman/sqrlly"
Repository = "https://github.com/christopherseaman/sqrlly"
Issues = "https://github.com/christopherseaman/sqrlly/issues"
Changelog = "https://github.com/christopherseaman/sqrlly/blob/main/CHANGELOG.md"

[project.scripts]
sqrlly = "sqrlly.cli.main:cli"

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqrlly"]

# Ship the agent skill doc inside the wheel so `sqrlly init --skill`
# can install it for pipx/pip users with no repo on disk. Single
# source: the repo-root SKILLS.md, copied to sqrlly/_skill.md at build.
[tool.hatch.build.targets.wheel.force-include]
"SKILLS.md" = "sqrlly/_skill.md"
# Curated examples scaffoldable via `sqrlly init --example` — pipx/uv-tool
# users have no repo checkout, so the run-essential files ride in the wheel
# under sqrlly/_examples/ (read by cli/init.py::_load_example_file).
"examples/jokes/workflow.yaml" = "sqrlly/_examples/jokes/workflow.yaml"
"examples/jokes/generate.md" = "sqrlly/_examples/jokes/generate.md"
"examples/jokes/select.md" = "sqrlly/_examples/jokes/select.md"
"examples/jokes/gates/validate_jokes.py" = "sqrlly/_examples/jokes/gates/validate_jokes.py"
"examples/route_classify/workflow.yaml" = "sqrlly/_examples/route_classify/workflow.yaml"
"examples/route_classify/scripts/triage.py" = "sqrlly/_examples/route_classify/scripts/triage.py"
"examples/explicit_join.yaml" = "sqrlly/_examples/explicit_join.yaml"
"examples/pipeline_style/workflow.yaml" = "sqrlly/_examples/pipeline_style/workflow.yaml"
# absurd-paper: the showcase (prompts + multi-dim gates + subgraph →
# rendered PDF). Run-essential files only.
"examples/absurd-paper/workflow.yaml" = "sqrlly/_examples/absurd-paper/workflow.yaml"
"examples/absurd-paper/preamble.md" = "sqrlly/_examples/absurd-paper/preamble.md"
"examples/absurd-paper/subgraphs/compose_and_validate.yaml" = "sqrlly/_examples/absurd-paper/subgraphs/compose_and_validate.yaml"
"examples/absurd-paper/prompts/abstract.md" = "sqrlly/_examples/absurd-paper/prompts/abstract.md"
"examples/absurd-paper/prompts/choose_topic.md" = "sqrlly/_examples/absurd-paper/prompts/choose_topic.md"
"examples/absurd-paper/prompts/discussion.md" = "sqrlly/_examples/absurd-paper/prompts/discussion.md"
"examples/absurd-paper/prompts/intro.md" = "sqrlly/_examples/absurd-paper/prompts/intro.md"
"examples/absurd-paper/prompts/methods.md" = "sqrlly/_examples/absurd-paper/prompts/methods.md"
"examples/absurd-paper/prompts/outline.md" = "sqrlly/_examples/absurd-paper/prompts/outline.md"
"examples/absurd-paper/prompts/reconcile.md" = "sqrlly/_examples/absurd-paper/prompts/reconcile.md"
"examples/absurd-paper/prompts/results.md" = "sqrlly/_examples/absurd-paper/prompts/results.md"
"examples/absurd-paper/gates/abstract_multi_dim.md" = "sqrlly/_examples/absurd-paper/gates/abstract_multi_dim.md"
"examples/absurd-paper/gates/choose_topic_eval.md" = "sqrlly/_examples/absurd-paper/gates/choose_topic_eval.md"
"examples/absurd-paper/gates/outline_json.py" = "sqrlly/_examples/absurd-paper/gates/outline_json.py"
"examples/absurd-paper/gates/submission_check.py" = "sqrlly/_examples/absurd-paper/gates/submission_check.py"
"examples/absurd-paper/scripts/persist_paper.py" = "sqrlly/_examples/absurd-paper/scripts/persist_paper.py"
"examples/absurd-paper/scripts/pick_topic.py" = "sqrlly/_examples/absurd-paper/scripts/pick_topic.py"
"examples/absurd-paper/scripts/render_pdf.py" = "sqrlly/_examples/absurd-paper/scripts/render_pdf.py"

[tool.hatch.build.targets.sdist]
# `.sqrlly/` is the foreman worktree pool — gitignored, but each
# worktree carries a tracked `.env.example` that the `!.env.example`
# un-ignore rule otherwise leaks into the sdist. Exclude it (plus
# checkpoint DBs, scratch dirs, and internal dev docs) explicitly.
# README / CHANGELOG / SCHEMA / LICENSE stay — they are user-facing.
exclude = [
    "/.sqrlly",
    "/.sqrlly/**",
    "/.temp",
    "/.temp/**",
    "/output",
    "/output/**",
    "**/*.db",
    "**/*.db-shm",
    "**/*.db-wal",
    "/.env",
    "/CLAUDE.md",
    "/TODO.md",
    # In-flight superpowers plan/spec docs and SDD scratch must never
    # ship to PyPI (the tracked set is deleted after each feature lands).
    "/docs/superpowers",
    "/docs/superpowers/**",
    "/.superpowers",
    "/.superpowers/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "acp: tests requiring a live ACP adapter + Claude API (may be slow/flaky)",
    "cli: tests requiring the `claude` CLI on PATH (transport: cli; may be slow/flaky)",
    "live: tests requiring live network access (consumed by tests/e2e/test_live_backend_roundtrip.py — cli-only after the api-transport strip)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "agent-client-protocol>=0.5",
]
