[project]
name = "sqrlly"
version = "0.1.0"
description = "Workflow orchestrator using LangGraph and Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "langgraph>=1.0",
    "jinja2>=3.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "ruamel.yaml>=0.17",
    "simpleeval>=0.9.13",
    "psutil>=5.9",
]

[project.scripts]
sqrlly = "sqrlly.cli.main:cli"

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqrlly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "acp: tests requiring a live ACP adapter + Claude API (may be slow/flaky)",
    "live: tests requiring a live API key on disk (ANTHROPIC_API_KEY / DEEPSEEK_API_KEY / OPENAI_API_KEY / CUSTOM_API_KEY+CUSTOM_API_BASE_URL); skipif per-key, opt-in via `pytest -m live`",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "agent-client-protocol>=0.5",
]
