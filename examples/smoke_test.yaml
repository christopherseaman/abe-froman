name: "Smoke Test"
version: "0.1.0"

nodes:
  - id: hello
    name: "Hello World"
    execute:
      url: "examples/prompts/hello.md"
settings:
  # `claude --safe-mode`: ignore operator customizations (output styles,
  # CLAUDE.md, skills, MCP, hooks) so the smoke test is reproducible.
  safe_mode: true
  presets:
    default:
      transport: cli
      provider: anthropic
      model: "sonnet"
      default: true
