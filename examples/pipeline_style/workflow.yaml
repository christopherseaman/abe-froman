name: "Pipeline-style authoring"
version: "0.1.0"

# Demonstrates `next:` (forward-pointer) edge authoring as an
# alternative to `depends_on:` (back-pointer). Both forms compile to
# the same topology — schema-side normalization in
# Graph.validate_node_references appends each `next:` source to its
# target's `depends_on:` list, then clears `next:`.
#
# Authors typically reach for `next:` when one source fans out to
# many successors (one place to write the edges) and `depends_on:`
# for fan-in barriers (one place to write the join).
#
# Linear chain rendered top-to-bottom:
#   step_one → step_two → step_three
#
# Pure script execution — runs without any LLM backend installed.
# `uv run abe-froman validate` and `uv run abe-froman graph` work
# straight away.

nodes:
  - id: step_one
    name: "Step one"
    next: ["step_two"]
    execute:
      url: "/usr/bin/echo"
      params:
        args: ["[step_one]"]

  - id: step_two
    name: "Step two"
    next: ["step_three"]
    execute:
      url: "/usr/bin/echo"
      params:
        args: ["[step_two] after {{step_one}}"]

  - id: step_three
    name: "Step three"
    execute:
      url: "/usr/bin/echo"
      params:
        args: ["[step_three] after {{step_two}}"]
