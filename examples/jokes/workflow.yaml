name: "Joke Generator"
version: "0.1.0"

# Demonstrates `transport: cli` and `transport: acp` coexisting in
# one workflow. `cli` is the default; switch with:
#
#   sqrlly run examples/jokes/workflow.yaml --preset acp
#   sqrlly run examples/jokes/workflow.yaml --preset cli      # explicit
#
# Env-var driven (defaults to cli when unset):
#
#   sqrlly run examples/jokes/workflow.yaml --preset ${SQRLLY_PRESET:-cli}

nodes:
  - id: generate
    name: "Generate Jokes"
    evaluation:
      validator: "examples/jokes/gates/validate_jokes.py"
      threshold: 1.0
      blocking: true
      max_retries: 2

    execute:
      url: "examples/jokes/generate.md"
  - id: select
    name: "Select Best Joke"
    depends_on: ["generate"]
    execute:
      url: "examples/jokes/select.md"

settings:
  presets:
    cli:
      transport: cli
      provider: openai
      model: "gpt-5.6-luna"
      default: true
    acp:
      transport: acp
      provider: anthropic
      model: "sonnet"
